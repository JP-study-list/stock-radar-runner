name: A-0 Manual Capability

on:
  workflow_dispatch:
    inputs:
      session_date:
        description: Optional YYYY-MM-DD session from the checked-in calendar snapshot
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: stock-radar-a0-live-capability
  cancel-in-progress: false

jobs:
  offline:
    name: Offline gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      session_date: ${{ steps.calendar.outputs.session_date }}
    steps:
      - name: Checkout reviewed bundle
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install locked development tools without scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm run test:unit
      - name: Fixture and integration tests
        run: npm run test:fixture
      - name: Security tests
        run: npm run test:security
      - name: Redaction tests
        run: npm run test:redaction
      - name: Workflow and publication dry-run
        run: npm run dry-run
      - name: Select confirmed session without provider access
        id: calendar
        env:
          SESSION_DATE: ${{ inputs.session_date }}
        run: npm run calendar:gate

  live:
    name: Bounded Fugle capability
    needs: offline
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment:
      name: live-capability
    steps:
      - name: Checkout reviewed bundle
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install locked development tools without scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build reviewed first-party entrypoint
        run: npm run build
      - name: Fetch, parse, evaluate, redact, and report
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
          SESSION_DATE: ${{ needs.offline.outputs.session_date }}
        run: node dist/src/cli/live-runner.js
